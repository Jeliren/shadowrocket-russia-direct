name: Update curated rules

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-curated-rules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Rebuild rule-set
        run: python3 scripts/build-shadowrocket_rules.py
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- direct-curated.list; then
            echo "No rule changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add direct-curated.list
          git commit -m "Update curated rules"
          git push
